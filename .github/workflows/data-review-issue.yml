name: Data Review Issue
on:
  schedule:
    - cron: 5 4 1 1,5,9 *
  workflow_dispatch:


jobs:
  create_issue:
    name: Create data review issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create data review issue
        run: |
          if [[ $CLOSE_PREVIOUS == true ]]; then
            previous_issue_number=$(gh issue list \
              --label "$LABELS" \
              --json number \
              --jq '.[0].number')
            if [[ -n $previous_issue_number ]]; then
              gh issue close "$previous_issue_number"
              gh issue unpin "$previous_issue_number"
            fi
          fi
          new_issue_url=$(gh issue create \
            --title "$TITLE" \
            --label "$LABELS" \
            --body "$BODY")
          if [[ $PINNED == true ]]; then
            gh issue pin "$new_issue_url"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Data Review - $(date +'%B %Y')
          LABELS: data review, autogenerated
          BODY: |
            ## Data to be reviewed

            - [ ] Degrees
              - [ ] Grades
              - [ ] Institutions
              - [ ] Subjects
              - [ ] Types
            - [ ] DQT
              - [ ] Degree Types
            - [ ] Equality and Diversity
              - [ ] Disabilities
            - [ ] HESA
              - [ ] Domiciles
            - [ ] ITT
              - [ ] Cycles
              - [ ] Incentives
              - [ ] Subjects
            - [ ] Age Ranges
            - [ ] Bank Holidays
            - [ ] CAH (Common Aggregation Hierarchy)
            - [ ] Countries and Territories
            - [ ] Qualifications
            - [ ] Subject Specialisms

          PINNED: true
          CLOSE_PREVIOUS: true
